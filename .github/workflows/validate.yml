name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-sync:
    name: Version sync across distribution files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check npm/plugin version coherence
        run: bash scripts/ci/check-versions.sh

      - name: Check pinned npm version coherence
        run: bash scripts/ci/check-pinned-npm.sh

  frontmatter-lint:
    name: Frontmatter rules for agents/commands/skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint frontmatter
        run: node scripts/ci/check-frontmatter.mjs

  typecheck-and-build:
    name: TypeScript typecheck + clean build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      # Clean build catches stale dist files that tsc --noEmit can't detect
      # (e.g., a deleted source file whose dist artifact lingers in the repo).
      # We rebuild from scratch and ensure tsc actually produces a fresh tree.
      - name: Clean build
        run: |
          rm -rf dist
          npm run build
          test -f dist/index.js
          test -f dist/cli/init.js
          test -f dist/cli/gen.js
