name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-sync:
    name: Version sync across distribution files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check npm/plugin version coherence
        run: bash scripts/ci/check-versions.sh

      - name: Check pinned npm version coherence
        run: bash scripts/ci/check-pinned-npm.sh

  frontmatter-lint:
    name: Frontmatter rules for agents/commands/skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lint frontmatter
        run: node scripts/ci/check-frontmatter.mjs

  typecheck-and-build:
    name: TypeScript, tests + clean build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4

      - name: Install locked deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        # pnpm otherwise uses cmd.exe on Windows even when this step uses bash.
        run: pnpm --config.script-shell=bash test

      # Clean build catches stale dist files that tsc --noEmit can't detect
      # (e.g., a deleted source file whose dist artifact lingers in the repo).
      # We rebuild from scratch and ensure tsc actually produces a fresh tree.
      - name: Clean build
        run: |
          rm -rf dist
          pnpm build
          test -f dist/index.js
          test -f dist/cli/init.js
          test -f dist/oauth-bridge.js
          test -f dist/token-bridge.js
          test ! -d dist/tools
          test ! -d dist/lib

      - name: Check packed artifact
        run: pnpm release:dry-run
